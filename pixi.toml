[workspace]
name = "tga_detection"
description = "tandem gene amplification detection"
version = "1.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tasks]
dry-run = "snakemake -n --cores 1 --sdm conda --configfile config/config.yaml"
run-conda = "snakemake --cores 2 --sdm conda --configfile config/config.yaml"
run-apptainer = "snakemake --cores 2 --configfile config/config.yaml --profile profiles/apptainer_local"
rulegraph = { cmd = "dot -c && snakemake --rulegraph --configfile config/config.yaml | dot -Tsvg > images/rulegraph.svg" }
dag = { cmd = "dot -c && snakemake --dag --configfile config/config.yaml | dot -Tsvg > images/dag.svg" }
test-r = "Rscript -e 'testthat::test_dir(\"tests\")'"
style-r = "Rscript -e 'styler::style_dir(\"workflow/scripts\")'"
lint-r = "Rscript -e 'lintr::lint_dir(\"workflow/scripts\")'"


[dependencies]
snakemake = "==8.23.1"
snakefmt = ">=0.11.2,<0.12"
micromamba = ">=2.5.0,<3"
python-graphviz = ">=0.21,<0.22"
cairo = ">=1.18.4,<2"
pango = ">=1.56.4,<2"
python = ">=3.12.12,<3.13"
apptainer = ">=1.3.4"
conda = ">=25.11.1,<26"
r-styler = ">=1.11.0,<2"
r-lintr = ">=3.3.0_1,<4"
r-testthat = ">=3.3.2,<4"
